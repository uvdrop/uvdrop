[project]
name = "uvdrop-portal-ghost-frame-recorder"
version = "0.0.1"
description = "Transparent overlay region selector and screen recorder with mic"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.5",
    "mss>=9.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
]

[tool.uv]
package = false
