[project]
name = "uvdrop-portal-ocr-bench"
version = "0.0.1"
description = "Tkinter OCR engine comparison bench"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "pytesseract>=0.3",
    "pyocr>=0.8",
    "easyocr>=1.7",
]

[project.optional-dependencies]
paddle = [
    "paddleocr>=2.7,<3",
    "paddlepaddle>=2.6",
]
manga = [
    "manga-ocr>=0.1",
]
baberu = [
    "huggingface-hub>=0.23",
    "onnxruntime>=1.17",
]

[tool.uv]
package = false
