[project]
name = "uvdrop"
version = "0.2.0"
description = "Practical offline uv launcher for Python apps (folder/ZIP → .env → uv sync/run)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "uvdrop contributors" }]
keywords = ["uv", "python", "launcher", "venv", "desktop"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
uvdrop = "uvdrop.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uvdrop"]

[tool.hatch.build.targets.wheel.sources]
"src/uvdrop" = "uvdrop"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
